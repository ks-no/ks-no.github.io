baseURL = "/"
uglyurls = false

languageCode = "nb-no"
defaultContentLanguage = "no"

title = "KS Fiks"
theme = "hugo-theme-relearn"
themesdir = "themes"
[markup.highlight]
codeFences = true
style = "monokailight"

defaultContentLanguageInSubdir= false
enableMissingTranslationPlaceholders = false

preservetaxonomynames = true

enableGitInfo = true

[languages]
  [languages.no]
    languageName = "Norsk"
    languageCode = "nb-no"
    weight = 1
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2

#Ser ikke ut til å fungere
[frontmatter]
date = ["date","publishDate", "lastmod"]
lastmod = ["lastmod", "date", "publishDate"]
publishDate = [":git", "lastmod", "publishDate", "date"]
expiryDate = ["expiryDate"]

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2

[params]
showVisitedLinks = false # default is false
themeVariant = ["ks-digital"]
collapsibleMenu = true # show chevrons in menu
alwaysopen = false # collapse menu on load
disableLandingPageButton = true
menushortcutsnewtab = false # set true to open shortcuts links to a new tab/window
enableGitInfo = true

[params.search]
  [params.search.adapter]
  identifier = "orama"

[outputs]
home = [ "HTML", "RSS"]


[[menu.shortcuts]]
pre = "<h3>Lenker</h3>"
name = "Github repo"
identifier = "ds"
url = "https://github.com/ks-no/ks-no.github.io"
weight = 10

[[menu.shortcuts]]
name = "<img src='/images/feed-icon-28x28.png' aria-hidden='true'>&nbsp;RSS"
url = "/index.xml"
weight = 11